services:
  postgres:
    image: 'postgres:latest'
    container_name: db-sena-empresa
    restart: always

    environment:
      - 'POSTGRES_DB=senaempresa'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/data/postgres

volumes:
  pgdata: